<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Snake — Space</title>
		<link rel="icon" type="icon/x-icon" href="/assets/favicon.ico" />
		<style>
			:root {
				--bg: #0d0d12;
				--panel: #16161f;
				--accent: #8f00ff;
				--accent2: #0d52bd;
				--text: #f1f1f5;
				--muted: #8a8a99;
				--grid: #1d1d29;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				background: radial-gradient(
					circle at 50% 0%,
					#1b1b2a 0%,
					var(--bg) 60%
				);
				color: var(--text);
				font-family:
					'DM Sans', system-ui, -apple-system, Segoe UI, Roboto,
					sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100%;
				padding: 24px;
			}
			.wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
			}
			h1 {
				margin: 0;
				font-size: 28px;
				letter-spacing: 1px;
				background: linear-gradient(90deg, var(--accent), var(--accent2));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.hud {
				display: flex;
				gap: 22px;
				align-items: center;
				font-size: 15px;
				color: var(--muted);
			}
			.hud span b {
				color: var(--text);
			}
			.board-holder {
				position: relative;
				border-radius: 14px;
				padding: 10px;
				background: var(--panel);
				box-shadow:
					0 0 0 1px #26263544,
					0 20px 60px -20px #000a;
			}
			canvas {
				display: block;
				background: var(--grid);
				border-radius: 8px;
				image-rendering: pixelated;
			}
			.overlay {
				position: absolute;
				inset: 10px;
				border-radius: 8px;
				background: #0009;
				backdrop-filter: blur(2px);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				text-align: center;
				padding: 16px;
			}
			.overlay.hidden {
				display: none;
			}
			.overlay h2 {
				margin: 0;
				font-size: 22px;
			}
			.overlay p {
				margin: 0;
				color: var(--muted);
				font-size: 14px;
				max-width: 260px;
			}
			button {
				cursor: pointer;
				border: none;
				border-radius: 999px;
				padding: 10px 22px;
				font-size: 14px;
				font-weight: 600;
				color: #fff;
				background: linear-gradient(90deg, var(--accent), var(--accent2));
				box-shadow: 0 6px 18px -6px #8f00ff88;
				transition: transform 0.15s ease;
			}
			button:active {
				transform: scale(0.96);
			}
			.controls {
				display: grid;
				grid-template-columns: repeat(3, 44px);
				grid-template-rows: repeat(2, 44px);
				gap: 6px;
				margin-top: 4px;
			}
			.controls button {
				background: #1d1d29;
				box-shadow: none;
				padding: 0;
				font-size: 18px;
				color: var(--text);
			}
			#up {
				grid-column: 2;
				grid-row: 1;
			}
			#left {
				grid-column: 1;
				grid-row: 2;
			}
			#down {
				grid-column: 2;
				grid-row: 2;
			}
			#right {
				grid-column: 3;
				grid-row: 2;
			}
			.back {
				margin-top: 6px;
				font-size: 13px;
				color: var(--muted);
				text-decoration: none;
			}
			.back:hover {
				color: var(--text);
			}
			@media (hover: hover) {
				.controls {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<h1>SNAKE</h1>
			<div class="hud">
				<span>Score: <b id="score">0</b></span>
				<span>Best: <b id="best">0</b></span>
			</div>
			<div class="board-holder">
				<canvas id="board" width="400" height="400"></canvas>
				<div class="overlay" id="overlay">
					<h2 id="overlayTitle">Ready?</h2>
					<p>Use arrow keys / WASD, or the on-screen pad. Eat the orbs, don't hit yourself or the wall.</p>
					<button id="startBtn">Start Game</button>
				</div>
			</div>
			<div class="controls">
				<button id="up">▲</button>
				<button id="left">◀</button>
				<button id="down">▼</button>
				<button id="right">▶</button>
			</div>
			<a class="back" href="/g">← Back to Games</a>
		</div>

		<script>
			const canvas = document.getElementById('board');
			const ctx = canvas.getContext('2d');
			const cell = 20;
			const cols = canvas.width / cell;
			const rows = canvas.height / cell;

			const scoreEl = document.getElementById('score');
			const bestEl = document.getElementById('best');
			const overlay = document.getElementById('overlay');
			const overlayTitle = document.getElementById('overlayTitle');
			const startBtn = document.getElementById('startBtn');

			let snake, dir, nextDir, food, score, best, loopId, running;

			best = Number(localStorage.getItem('snake_best') || 0);
			bestEl.textContent = best;

			function reset() {
				snake = [
					{ x: 8, y: 10 },
					{ x: 7, y: 10 },
					{ x: 6, y: 10 }
				];
				dir = { x: 1, y: 0 };
				nextDir = dir;
				score = 0;
				scoreEl.textContent = score;
				placeFood();
			}

			function placeFood() {
				let pos;
				do {
					pos = {
						x: Math.floor(Math.random() * cols),
						y: Math.floor(Math.random() * rows)
					};
				} while (snake.some(s => s.x === pos.x && s.y === pos.y));
				food = pos;
			}

			function draw() {
				ctx.fillStyle = '#1d1d29';
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				ctx.fillStyle = '#ff4d6d';
				ctx.beginPath();
				ctx.arc(
					food.x * cell + cell / 2,
					food.y * cell + cell / 2,
					cell / 2.6,
					0,
					Math.PI * 2
				);
				ctx.fill();

				snake.forEach((s, i) => {
					const t = i / snake.length;
					ctx.fillStyle = i === 0 ? '#c084fc' : lerpColor('#8f00ff', '#0d52bd', t);
					ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
				});
			}

			function lerpColor(a, b, t) {
				const ah = parseInt(a.slice(1), 16),
					bh = parseInt(b.slice(1), 16);
				const ar = (ah >> 16) & 0xff,
					ag = (ah >> 8) & 0xff,
					ab = ah & 0xff;
				const br = (bh >> 16) & 0xff,
					bg = (bh >> 8) & 0xff,
					bb = bh & 0xff;
				const rr = Math.round(ar + (br - ar) * t);
				const rg = Math.round(ag + (bg - ag) * t);
				const rb = Math.round(ab + (bb - ab) * t);
				return `rgb(${rr},${rg},${rb})`;
			}

			function step() {
				dir = nextDir;
				const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

				if (
					head.x < 0 ||
					head.y < 0 ||
					head.x >= cols ||
					head.y >= rows ||
					snake.some(s => s.x === head.x && s.y === head.y)
				) {
					return gameOver();
				}

				snake.unshift(head);

				if (head.x === food.x && head.y === food.y) {
					score++;
					scoreEl.textContent = score;
					placeFood();
				} else {
					snake.pop();
				}

				draw();
			}

			function gameOver() {
				running = false;
				clearInterval(loopId);
				if (score > best) {
					best = score;
					localStorage.setItem('snake_best', best);
					bestEl.textContent = best;
				}
				overlayTitle.textContent = `Game Over — Score: ${score}`;
				startBtn.textContent = 'Play Again';
				overlay.classList.remove('hidden');
			}

			function start() {
				reset();
				draw();
				overlay.classList.add('hidden');
				running = true;
				clearInterval(loopId);
				loopId = setInterval(step, 110);
			}

			startBtn.addEventListener('click', start);

			function setDir(x, y) {
				if (!running) return;
				if (dir.x === -x && dir.y === -y) return;
				nextDir = { x, y };
			}

			window.addEventListener('keydown', e => {
				switch (e.key) {
					case 'ArrowUp':
					case 'w':
					case 'W':
						setDir(0, -1);
						break;
					case 'ArrowDown':
					case 's':
					case 'S':
						setDir(0, 1);
						break;
					case 'ArrowLeft':
					case 'a':
					case 'A':
						setDir(-1, 0);
						break;
					case 'ArrowRight':
					case 'd':
					case 'D':
						setDir(1, 0);
						break;
					case ' ':
						if (!running) start();
						break;
				}
			});

			document.getElementById('up').addEventListener('click', () => setDir(0, -1));
			document.getElementById('down').addEventListener('click', () => setDir(0, 1));
			document.getElementById('left').addEventListener('click', () => setDir(-1, 0));
			document.getElementById('right').addEventListener('click', () => setDir(1, 0));

			let touchStart = null;
			canvas.addEventListener('touchstart', e => {
				touchStart = e.touches[0];
			});
			canvas.addEventListener('touchend', e => {
				if (!touchStart) return;
				const dx = e.changedTouches[0].clientX - touchStart.clientX;
				const dy = e.changedTouches[0].clientY - touchStart.clientY;
				if (Math.abs(dx) > Math.abs(dy)) {
					setDir(dx > 0 ? 1 : -1, 0);
				} else {
					setDir(0, dy > 0 ? 1 : -1);
				}
				touchStart = null;
			});

			reset();
			draw();
		</script>
	</body>
</html>
